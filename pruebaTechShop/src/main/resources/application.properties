#Correo SMTP para el envio del email de activacion de cuenta (RegistroService).
#PENDIENTE: username/password son placeholders; el envio real fallara hasta que se
#reemplacen por credenciales reales (ej. Gmail + contrasena de aplicacion). Sin embargo
#estas propiedades SI deben estar presentes: sin spring.mail.host, Spring Boot ni siquiera
#crea el bean JavaMailSender y la aplicacion completa no arranca (CorreoService lo requiere).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=PENDIENTE_configurar_correo_real
spring.mail.password=PENDIENTE_configurar_contrasena_de_aplicacion
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
