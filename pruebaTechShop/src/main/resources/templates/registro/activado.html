<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <div class="container text-center my-5">
            <div th:if="${usuario != null}">
                <i class="fa-solid fa-circle-check fa-3x text-success mb-3"></i>
                <h2>[[#{registro.activadoTitulo}]]</h2>
                <p>[[#{registro.activadoTexto}]]</p>
            </div>
            <div th:if="${usuario == null}">
                <i class="fa-solid fa-circle-xmark fa-3x text-danger mb-3"></i>
                <h2>[[${titulo}]]</h2>
                <p>[[${mensaje}]]</p>
            </div>
            <a th:href="@{/login}" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> [[#{login.login}]]</a>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
