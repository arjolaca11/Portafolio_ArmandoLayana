<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <!-- fragmento 1: tabs de categorias para filtrar el escaparate de productos -->
        <section th:fragment="tabs" class="py-3 mb-4">
            <div class="d-flex justify-content-center px-5">
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a th:href="@{/}"
                           th:classappend="${idCategoriaActual == null} ? 'active'"
                           class="nav-link"
                           aria-current="page">
                            [[#{consultas.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                           th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                           class="nav-link">
                            [[${c.descripcion}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>

        <!-- fragmento 2 para el listado de tarjetas de productos -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="p : ${productos}" class="col">
                    <div class="card producto-card h-100 shadow-sm">
                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 200px;">
                            <img th:src="${p.rutaImagen}" class="img-fluid" th:alt="${p.descripcion}"
                                 style="max-height: 100%; object-fit: contain;"/>
                        </div>
                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0" th:text="${p.descripcion}">Titulo</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate" th:text="${p.detalle}">Detalle</p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5" th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">₡99,99</span>
                                <span th:if="${p.existencias > 0}" class="badge text-bg-success ms-2" th:text="${p.existencias} + ' unidades'"></span>
                                <span th:unless="${p.existencias > 0}" class="badge text-bg-danger ms-2">Agotado</span>
                            </div>
                            <form th:action="@{/carrito/agregar}" method="post" class="d-inline">
                                <input type="hidden" th:value="${p.idProducto}" name="idProducto"/>
                                <button type="submit"
                                        class="btn btn-sm btn-primary"
                                        th:disabled="${p.existencias == 0}"
                                        onclick="addCart(this.form)">
                                    <i class="fa-solid fa-cart-plus"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmento 3: formulario reutilizable de consulta por rango de precio -->
        <div th:fragment="formConsulta(colorForm, textoForm, urlForm)">
            <form method="post" th:action="@{${urlForm}}" class="was-validated">
                <div class="card p-2">
                    <div class="card-header text-center text-white" th:classappend="${'bg-' + colorForm}">
                        <h5>[[${textoForm}]]</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>[[#{consultas.precioInferior}]]</label>
                            <input type="number" name="precioInf" th:value="${precioInf}" class="form-control" min="0" step="0.01" required/>
                        </div>
                        <div class="mb-3">
                            <label>[[#{consultas.precioSuperior}]]</label>
                            <input type="number" name="precioSup" th:value="${precioSup}" class="form-control" min="0" step="0.01" required/>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button type="submit" class="btn text-white" th:classappend="${'btn-' + colorForm}">
                            <i class="fa-solid fa-magnifying-glass"></i> [[${textoForm}]]
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- fragmento 4: reto sem08, consulta propia (busqueda por texto en la descripcion) -->
        <div th:fragment="formBuscar">
            <form method="post" th:action="@{/consultas/buscar}" class="was-validated">
                <div class="card p-2">
                    <div class="card-header text-center text-white bg-dark">
                        <h5>[[#{consultas.busqueda}]]</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>[[#{consultas.textoBuscar}]]</label>
                            <input type="text" name="texto" th:value="${texto}" class="form-control" maxlength="50" required/>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button type="submit" class="btn btn-dark text-white">
                            <i class="fa-solid fa-magnifying-glass"></i> [[#{consultas.busqueda}]]
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- fragmento 5: agrupa los 4 formularios de consulta (3 formas ensenadas + el reto propio) -->
        <section th:fragment="consultas" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 p-2">
            <div th:replace="~{consultas/fragmentos :: formConsulta('primary', #{consultas.derivadas}, '/consultas/consultaDerivada')}"></div>
            <div th:replace="~{consultas/fragmentos :: formConsulta('warning', #{consultas.jpql}, '/consultas/consultaJPQL')}"></div>
            <div th:replace="~{consultas/fragmentos :: formConsulta('success', #{consultas.sql}, '/consultas/consultaSQL')}"></div>
            <div th:replace="~{consultas/fragmentos :: formBuscar}"></div>
        </section>
    </body>
</html>
